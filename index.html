<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lor Donado Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #c48a9e; /* soft mauve matching the mockup */
      font-family: 'Patrick Hand', 'Caveat', cursive;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Header */
    header {
      width: 100%;
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    .logo {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 1.8rem;
      line-height: 1.1;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
      font-size: clamp(1.35rem, 3.5vw, 1.7rem);
    }

    nav a {
      color: #1a1a1a;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.65;
    }

    nav .divider {
      opacity: 0.5;
      user-select: none;
    }

    /* Bio */
    .bio-label {
      margin-top: 2.8rem;
      font-size: clamp(1.6rem, 4vw, 2rem);
      letter-spacing: 1px;
    }

    /* Gallery Frame */
    .gallery-section {
      margin-top: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      width: 100%;
      max-width: 680px;
      padding: 0 1rem;
    }

    .arrow {
      background: none;
      border: none;
      font-size: 2.4rem;
      cursor: pointer;
      color: #1a1a1a;
      padding: 0.4rem 0.6rem;
      transition: transform 0.2s ease, opacity 0.2s;
      line-height: 1;
      user-select: none;
    }

    .arrow:hover {
      transform: scale(1.15);
      opacity: 0.75;
    }

    .arrow:active {
      transform: scale(0.95);
    }

    .frame {
      position: relative;
      width: min(320px, 78vw);
      aspect-ratio: 1 / 1;
      background: #5a5a5a;
      border: 3px solid #f5f0f0;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5a5a5a;
      color: #111;
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      text-align: center;
      line-height: 1.35;
      padding: 1.5rem;
      font-weight: 600;
    }

    /* Placeholder for real images – just replace the .slide content */
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom-right icon */
    .qr-icon {
      position: fixed;
      bottom: 1.6rem;
      right: 1.6rem;
      width: 52px;
      height: 52px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s;
      z-index: 20;
    }

    .qr-icon:hover {
      transform: scale(1.08);
      background: #000;
    }

    .qr-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #f5f0f0;
      stroke-width: 1.8;
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .gallery-section {
        gap: 0.6rem;
      }
      .arrow {
        font-size: 1.9rem;
      }
      .qr-icon {
        bottom: 1.2rem;
        right: 1.2rem;
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Lor Donado Art</div>
    <nav>
      <a href="#gallery">Gallery</a>
      <span class="divider">|</span>
      <a href="#contact">Contact</a>
      <span class="divider">|</span>
      <a href="#pricing">Pricing</a>
    </nav>
  </header>

  <div class="bio-label">Bio</div>

  <section class="gallery-section" id="gallery">
    <button class="arrow" id="prev" aria-label="Previous">←</button>

    <div class="frame">
      <div class="slides" id="slides">
        <!-- Slide 1 -->
        <div class="slide">
          Moving<br>frame<br>showing<br>gallery<br>previews
        </div>

        <!-- Slide 2 – replace with real image -->
        <div class="slide">
          <!-- Example: <img src="images/piece1.jpg" alt="Artwork 1"> -->
          Artwork 01<br><small style="font-size:0.85em;opacity:0.8">Oil on canvas</small>
        </div>

        <!-- Slide 3 -->
        <div class="slide">
          Artwork 02<br><small style="font-size:0.85em;opacity:0.8">Mixed media</small>
        </div>

        <!-- Slide 4 -->
        <div class="slide">
          Artwork 03<br><small style="font-size:0.85em;opacity:0.8">Charcoal</small>
        </div>
      </div>
    </div>

    <button class="arrow" id="next" aria-label="Next">→</button>
  </section>

  <!-- Bottom-right icon (QR / Instagram / menu) -->
  <div class="qr-icon" title="Scan or contact" onclick="alert('Add your QR / Instagram / contact link here')">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <path d="M14 14h3v3h-3zM17 17h3v3h-3zM14 20h3"/>
    </svg>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const total = slides.children.length;
    let index = 0;

    function goTo(i) {
      index = (i + total) % total;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById('prev').addEventListener('click', () => goTo(index - 1));
    document.getElementById('next').addEventListener('click', () => goTo(index + 1));

    // Optional: keyboard arrows
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goTo(index - 1);
      if (e.key === 'ArrowRight') goTo(index + 1);
    });

    // Optional: auto-play every 5 seconds (uncomment if wanted)
    // setInterval(() => goTo(index + 1), 5000);
  </script>
</body>
</html>
